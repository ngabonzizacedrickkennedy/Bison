[project]
name = "task-runner-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bison-contracts",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "wasmtime>=47.0.0",
    "pywin32>=306 ; sys_platform == 'win32'",
    "psutil>=7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_runner_service"]

[tool.uv.sources]
bison-contracts = { path = "../../packages/contracts-py" }

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.120.0",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/probe_*.py" = ["S603"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = [
    "psutil",
    "pywintypes",
    "win32api",
    "win32con",
    "win32event",
    "win32file",
    "win32job",
    "win32pipe",
    "win32process",
    "win32security",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
