[project]
name = "bison-contracts"
version = "0.1.0"
description = "Generated Pydantic models for BISON cross-service contracts"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bison_contracts"]
artifacts = ["src/bison_contracts/prompts/*.md", "src/bison_contracts/py.typed"]

[dependency-groups]
dev = ["datamodel-code-generator>=0.26.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
