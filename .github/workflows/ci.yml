name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate contracts
        run: pnpm codegen

      - name: Check prompt hashes
        run: pnpm check:prompts

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check formatting
        run: pnpm format:check

      - name: Sync python environments
        run: pnpm py:sync

      - name: Lint python
        run: pnpm py:lint

      - name: Typecheck python
        run: pnpm py:typecheck

      - name: Test python
        run: pnpm py:test

      - name: Assert no generated artifacts are tracked
        run: git diff --exit-code
